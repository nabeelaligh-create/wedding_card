name: Check Mehfil
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and data exports
        run: |
          npm run check
          npm test
      - name: Build the public website
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
